[package]
name = "dtsx-inspect"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Inventory, table and column lineage, lint and HTML report for SSIS packages (.dtsx)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oodinhoo/dtsx-inspect"
readme = "README.md"
keywords = ["ssis", "dtsx", "lineage", "etl", "sql-server"]
categories = ["command-line-utilities", "development-tools", "database"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
petgraph = "0.8.3"
quick-xml = "0.42.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlparser = { version = "0.63.0", features = ["visitor"] }
thiserror = "2.0.21"
walkdir = "2.5.0"

[dev-dependencies]
insta = "1.49.0"
