name: Release
on:
  push:
    tags: ["v*"]

permissions: {}

# One release at a time per tag, never cancelled halfway through publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: windows
    runs-on: windows-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store the attestation in the repository
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # rustup ships with the runner: no third-party action to trust and keep pinned.
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      # A tag that does not match Cargo.toml would publish an exe with a wrong --version.
      # Values reach the scripts through the environment, never pasted into their code.
      - name: Check the tag matches Cargo.toml
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG but Cargo.toml says $version" }
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        id: package
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $zip = "dtsx-inspect-$env:TAG-windows-x64.zip"
          Compress-Archive -Path target/release/dtsx-inspect.exe, LICENSE-MIT, LICENSE-APACHE, README.md -DestinationPath $zip
          "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())  $zip" | Out-File -Encoding ascii "$zip.sha256"
          "zip=$zip" >> $env:GITHUB_OUTPUT
      # Lets anyone check the exe was built here, from this tag: gh attestation verify.
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            target/release/dtsx-inspect.exe
            ${{ steps.package.outputs.zip }}
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          gh release create $env:TAG $env:ZIP "$env:ZIP.sha256" --title $env:TAG --generate-notes
